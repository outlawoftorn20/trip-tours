<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Trip Tours</title>
<style>
:root{--bg:#0f1318;--card:#1a212a;--card2:#232c37;--tx:#e9edf1;--dim:#93a0ae;--gold:#f2b84b;--ok:#5fd08a;--bad:#ff7a6b;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif}
body{padding:calc(12px + env(safe-area-inset-top)) 14px calc(90px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;user-select:none;-webkit-user-select:none}
h1{margin:4px 0 0;font:700 28px/1.1 Georgia,'Playfair Display',serif;letter-spacing:.2px}
h2{margin:6px 0 2px;font:700 22px/1.2 Georgia,serif}
h3{margin:18px 2px 6px;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--gold)}
p{margin:8px 0}
.sub,.hint,.meta{color:var(--dim);font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:12px 0}
.big{font-size:20px;font-weight:600;margin-bottom:4px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.row{display:flex;gap:10px;margin-top:12px}
.row>*{flex:1;min-width:0}
button,.btn{font:600 16px system-ui,sans-serif;color:#1b1405;background:var(--gold);border:0;border-radius:12px;padding:14px 12px;min-height:52px;cursor:pointer}
button.alt,.btn.alt{background:var(--card2);color:var(--tx)}
button.small{min-height:44px;padding:10px 12px;font-size:14px}
button:disabled{opacity:.4}
button.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--tx);font-weight:500;margin:6px 0;border-radius:12px;padding:14px}
button.row2.cur{outline:2px solid var(--gold)}
button.row2 .meta{white-space:nowrap;text-align:right}
button.row2 .rt{flex:1;min-width:0;display:block}
button.row2 .rt b{font-weight:600}
.sum{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--dim);font-size:13px;margin-top:3px;font-weight:400}
.note{background:#2b3440;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.note.err{background:#4a2420}.note.good{background:#1f3b2b}
.back{background:none;color:var(--gold);padding:6px 0;min-height:40px;font-weight:600}
.time{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;color:var(--dim);font-size:14px}
input[type=range]{width:100%;height:36px;accent-color:var(--gold)}
input[type=text]{width:100%;background:#0a0d11;color:var(--tx);border:1px solid #38434f;border-radius:10px;padding:10px;font:14px ui-monospace,Menlo,monospace;user-select:text;-webkit-user-select:text}
.ctl{display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0}
.ctl button{min-width:58px;padding:12px 8px;display:flex;align-items:center;justify-content:center}
.ctl .play{flex:1;min-height:68px}
.chip{display:inline-block;background:var(--card2);color:var(--dim);border-radius:99px;padding:2px 9px;font-size:12px;margin-left:6px;vertical-align:middle;font-weight:500}
.chip.ok{background:#1f3b2b;color:var(--ok)}.chip.warn{background:#4a2420;color:var(--bad)}.chip.sombre{background:#33293f;color:#c9b3ff}
.banner{background:var(--gold);color:#1b1405;border-radius:var(--r);padding:14px;margin:12px 0;font-weight:700;text-align:center}
.banner .cd{font-size:44px;font-variant-numeric:tabular-nums;line-height:1.1}
.upd{background:#2a2412;border:2px solid var(--gold);border-radius:var(--r);padding:14px;margin:12px 0}
.upd b{display:block;margin-bottom:4px}
.fin{background:#1f3b2b;border:2px solid var(--ok);border-radius:var(--r);padding:12px;margin:12px 0;text-align:center}
.listen{background:var(--card2);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.mini{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:540px;margin:0 auto;background:var(--card2);border:1px solid #38434f;border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 6px 24px #0008}
.mini b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.mini button{display:flex;align-items:center;justify-content:center;min-width:52px}
.clock{font:700 38px/1.1 ui-monospace,Menlo,monospace;text-align:center;letter-spacing:1px;color:var(--gold);margin:6px 0}
pre.log{background:#0a0d11;border-radius:10px;padding:10px;font:11px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;user-select:text;-webkit-user-select:text}
.overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9;padding:24px}
.overlay .card{width:100%;max-width:400px;margin:0}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;width:0;background:var(--gold)}
.tog{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.tog button{flex:0 0 96px}
ul.bad{margin:8px 0 0;padding-left:18px;font-size:13px}
details{margin:10px 0}summary{color:var(--gold);font-weight:600;padding:6px 0}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
.btn.small{min-height:44px;padding:10px 12px;font-size:14px}
.btn.together{display:block;width:100%;margin-top:12px}
.spot{background:var(--card);border-radius:var(--r);padding:14px;margin:12px 0;border:2px solid transparent}
.spot.near{border-color:var(--gold)}
.spot.here{border-color:var(--ok);background:#1b3326}
.spot .lead{display:flex;gap:14px;align-items:center;margin:10px 0 6px}
.spot .arrow{width:84px;height:84px;flex:0 0 84px;color:var(--gold)}
.spot.here .arrow{color:var(--ok)}
.spot .arrow svg{width:100%;height:100%;display:block;transition:transform .15s linear}
.spot .dist{font:700 32px/1.1 system-ui,sans-serif;font-variant-numeric:tabular-nums}
.spot.here .dist{color:var(--ok)}
.stext{background:var(--card2);border-radius:10px;padding:10px 12px;margin:8px 0 4px;font-size:15px;line-height:1.45}
button.city{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;color:var(--gold);min-height:46px;padding:10px 2px;margin-top:10px;border-bottom:1px solid #2b3440;border-radius:0;font:700 13px system-ui,sans-serif;letter-spacing:.8px;text-transform:uppercase;text-align:left}
button.city .meta{text-transform:none;letter-spacing:0;font-weight:500}
button.row2.locked{opacity:.55}
button.row2.past{opacity:.6}
.chip.lock{background:#2b3440;color:var(--dim)}
.chip.day{background:#2a2412;color:var(--gold)}
.today{border:2px solid var(--gold);border-radius:var(--r);padding:6px 10px 8px;margin:14px 0}
.today h3{margin-top:8px}
.lockcard{background:#2b3440;border-radius:var(--r);padding:14px;margin:12px 0}
input.pin{font:700 26px ui-monospace,Menlo,monospace;letter-spacing:8px;text-align:center}
input[type=date]{width:100%;background:#0a0d11;color:var(--tx);border:1px solid #38434f;border-radius:10px;padding:10px;font:16px system-ui,sans-serif}
</style>
</head>
<body>
<div id="app"></div>
<audio id="a" preload="auto" playsinline></audio>
<input type="file" id="pick" accept=".zip,application/zip,application/x-zip-compressed" hidden>
<script>
(function(){
'use strict';
var VER = '0.4';
var $ = function(s){ return document.querySelector(s); };
var app = $('#app'), A = $('#a'), pick = $('#pick');
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(s){ s = Math.max(0, Math.round(s || 0)); var m = Math.floor(s/60), r = s % 60; return m + ':' + String(r).padStart(2,'0'); }
function fmtMB(b){ return (b/1048576).toFixed(b < 10485760 ? 1 : 0) + ' MB'; }
function p2(n){ return String(n).padStart(2,'0'); }
function clock(ms){ var d = new Date(ms); return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())+'.'+String(d.getMilliseconds()).padStart(3,'0'); }
function when(ms){ var d = new Date(ms); return d.getDate()+'/'+(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes()); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function jget(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function jset(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ---------- state ---------- */
var S = { view:'home', locId:null, sesId:null, cat:null, have:{}, tree:[], tmap:{}, smap:{}, lmap:{}, fp:'', busy:null, msg:null,
          playing:false, ended:false, arm:null, startTarget:null, confirmClear:false, clockTok:0, storage:null, upd:null, lastCheck:0, cancel:false, open:null, pin:null };
var cfg = Object.assign({ speed:1, auto:false, trim:0, wake:false, base:'', geo:false, testSpot:null, lockOn:true, today:'' }, jget('tt-cfg', {}));
function saveCfg(){ jset('tt-cfg', cfg); }
var played = jget('tt-played', {});
var unlocks = Object.assign({ s:{}, d:{} }, jget('tt-unlock', {}));
function saveUnlocks(){ jset('tt-unlock', unlocks); }
var cur = null;   // { t: track, url }

/* ---------- log ---------- */
var logbuf = jget('tt-log', []);
function log(m){
  var d = new Date();
  logbuf.push(p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())+'.'+String(d.getMilliseconds()).padStart(3,'0')+' '+m);
  if (logbuf.length > 400) logbuf = logbuf.slice(-400);
  jset('tt-log', logbuf);
  var el = $('#logbox'); if (el){ el.textContent = logbuf.slice(-80).join('\n'); el.scrollTop = el.scrollHeight; }
}

/* ---------- IndexedDB: audio blobs, per-track records, catalogue ---------- */
var dbp;
function db(){
  if (dbp) return dbp;
  dbp = new Promise(function(res, rej){
    var r = indexedDB.open('trip-tours-v1', 2);
    r.onupgradeneeded = function(){
      var d = r.result;
      if (!d.objectStoreNames.contains('index')) d.createObjectStore('index', { keyPath:'id' });
      if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs');
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
    };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
  return dbp;
}
function rq(r){ return new Promise(function(res, rej){ r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }
function txdone(t){ return new Promise(function(res, rej){ t.oncomplete = res; t.onerror = function(){ rej(t.error); }; t.onabort = function(){ rej(t.error || new Error('aborted')); }; }); }
function idbPut(rec, blob){ return db().then(function(d){ var t = d.transaction(['index','blobs'], 'readwrite'); t.objectStore('blobs').put(blob, rec.id); t.objectStore('index').put(rec); return txdone(t); }); }
function idbDel(ids){ return db().then(function(d){ var t = d.transaction(['index','blobs'], 'readwrite'); ids.forEach(function(id){ t.objectStore('blobs').delete(id); t.objectStore('index').delete(id); }); return txdone(t); }); }
function idbBlob(id){ return db().then(function(d){ return rq(d.transaction('blobs').objectStore('blobs').get(id)); }); }
function idbHave(){ return db().then(function(d){ return rq(d.transaction('index').objectStore('index').getAll()); }).then(function(a){ var m = {}; a.forEach(function(r){ m[r.id] = { sha256:r.sha256, size:r.size || 0 }; }); return m; }); }
function metaGet(k){ return db().then(function(d){ return rq(d.transaction('meta').objectStore('meta').get(k)); }); }
function metaPut(k, v){ return db().then(function(d){ var t = d.transaction('meta', 'readwrite'); t.objectStore('meta').put(v, k); return txdone(t); }); }
function idbClearAll(){ return db().then(function(d){ var t = d.transaction(['index','blobs','meta'], 'readwrite'); t.objectStore('index').clear(); t.objectStore('blobs').clear(); t.objectStore('meta').clear(); return txdone(t); }); }

/* ---------- catalogue ---------- */
function normCat(man){
  if (!man || !man.tracks) throw new Error('Not a Trip Tours catalogue');
  if (man.version >= 2) return { version:2, catalogueVersion:man.catalogueVersion || 0, pack:man.pack || '', built:man.built || '',
                                 locations:man.locations || [], sessions:man.sessions || [], tracks:man.tracks, lock:man.lock || null };
  // version 1 (test pack): site -> location with one session
  var locs = {}, sess = [], tracks = [];
  man.tracks.forEach(function(t){
    if (!locs[t.siteId]){
      locs[t.siteId] = { id:t.siteId, title:t.siteTitle || t.siteId, city:t.city || '', day:t.day || 0, order:t.siteOrder || 0, summary:'' };
      sess.push({ id:t.siteId + '-1', locationId:t.siteId, number:1, title:t.siteTitle || t.siteId, summary:'', listenAt:'', tone:t.tone || 'fun', order:1 });
    }
    tracks.push({ id:t.id, sessionId:t.siteId + '-1', number:t.order || 1, title:t.title, summary:'', file:t.file, dur:t.dur, sha256:t.sha256, size:t.size || 0 });
  });
  return { version:2, catalogueVersion:0, pack:man.pack || '', built:man.built || '', locations:Object.keys(locs).map(function(k){ return locs[k]; }), sessions:sess, tracks:tracks };
}
function buildTree(){
  var c = S.cat; S.tree = []; S.tmap = {}; S.smap = {}; S.lmap = {};
  if (!c) return;
  var byS = {}, byL = {};
  c.tracks.forEach(function(t){ S.tmap[t.id] = t; (byS[t.sessionId] = byS[t.sessionId] || []).push(t); });
  c.sessions.forEach(function(s){
    s.tracks = (byS[s.id] || []).sort(function(a, b){ return (a.number||0) - (b.number||0); });
    S.smap[s.id] = s; (byL[s.locationId] = byL[s.locationId] || []).push(s);
  });
  var locs = c.locations.slice().sort(function(a, b){ return (a.day||0) - (b.day||0) || (a.order||0) - (b.order||0) || String(a.title).localeCompare(b.title); });
  locs.forEach(function(l){
    l.sessions = (byL[l.id] || []).sort(function(a, b){ return (a.order||0) - (b.order||0) || (a.number||0) - (b.number||0); });
    S.lmap[l.id] = l;
  });
  S.tree = locs;
}
function tstate(t){ var h = S.have[t.id]; return !h ? 'missing' : (h.sha256 === t.sha256 ? 'ready' : 'stale'); }
function playable(t){ return !!S.have[t.id]; }
function sesDur(s){ return s.tracks.reduce(function(a, t){ return a + (t.dur || 0); }, 0); }
function sesReady(s){ return s.tracks.filter(function(t){ return tstate(t) === 'ready'; }).length; }
function sesPlayed(s){ return s.tracks.length > 0 && s.tracks.every(function(t){ return played[t.id]; }); }
function locDur(l){ return l.sessions.reduce(function(a, s){ return a + sesDur(s); }, 0); }
function allTracks(){ return S.cat ? S.cat.tracks : []; }
function sha256(buf){
  return crypto.subtle.digest('SHA-256', buf).then(function(h){
    return Array.prototype.map.call(new Uint8Array(h), function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  });
}
async function fingerprint(){
  if (!S.cat) return '';
  var parts = S.cat.tracks.filter(function(t){ return tstate(t) === 'ready'; }).map(function(t){ return t.id + ':' + t.sha256; }).sort();
  return (await sha256(new TextEncoder().encode(S.cat.catalogueVersion + '|' + parts.join(',')))).slice(0, 6);
}
async function refreshState(){
  S.have = await idbHave();
  var raw = await metaGet('catalogue');
  S.cat = raw ? clone(raw) : null;
  buildTree();
  S.fp = await fingerprint();
}
function readyCount(){ return allTracks().filter(function(t){ return tstate(t) === 'ready'; }).length; }
function readyBytes(){ return allTracks().reduce(function(a, t){ return a + (tstate(t) === 'ready' ? (S.have[t.id].size || t.size || 0) : 0); }, 0); }

/* ---------- dates and the lock ---------- */
// Dates are YYYY-MM-DD strings, compared as text. "Today" is the phone's local date (phones change time zone on their own).
function isoDate(d){ return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function validISO(x){ return typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x); }
function todayISO(){ return validISO(cfg.today) ? cfg.today : isoDate(new Date()); }
var DAYN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MONN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDay(iso){ if (!validISO(iso)) return ''; var d = new Date(+iso.slice(0,4), +iso.slice(5,7) - 1, +iso.slice(8,10)); return DAYN[d.getDay()] + ' ' + d.getDate() + ' ' + MONN[d.getMonth()]; }
function locOf(s){ return s ? S.lmap[s.locationId] : null; }
function sesDate(s){ var l = locOf(s); return (s && validISO(s.date) && s.date) || (l && validISO(l.date) && l.date) || null; }
function sesFrom(s){ var l = locOf(s); return (s && validISO(s.showFrom) && s.showFrom) || (s && validISO(s.date) && s.date) || (l && validISO(l.showFrom) && l.showFrom) || (l && validISO(l.date) && l.date) || null; }
function locDate(l){ var ds = l.sessions.map(sesDate).filter(Boolean).sort(); return (validISO(l.date) && l.date) || ds[0] || null; }
function locLast(l){ var ds = l.sessions.map(sesDate).filter(Boolean).sort(); return ds[ds.length - 1] || (validISO(l.date) && l.date) || null; }
function remoteOff(){ return !!(S.cat && S.cat.lock && S.cat.lock.mode === 'off'); }
function neverLocked(s){ return s.lock === 'never' || (s.kind === 'start' && s.lock !== 'date'); }
// Locked = the lock is on, the session has an unlock date in the future, and nobody has unlocked it on this phone.
function isLocked(s){
  if (!s || remoteOff() || !cfg.lockOn || neverLocked(s)) return false;
  var from = sesFrom(s); if (!from || from <= todayISO()) return false;
  var d = sesDate(s);
  return !(unlocks.s[s.id] || (d && unlocks.d[d]) || unlocks.d[from]);
}
function lockNote(s){ return 'Unlocks ' + fmtDay(sesFrom(s)); }
function trackLocked(t){ return isLocked(S.smap[t.sessionId]); }

/* ---------- parent PIN (stored only as a hash, only on this phone) ---------- */
function pinHash(pin){ return sha256(new TextEncoder().encode('trip-tours-pin|' + pin)); }
function pinSet(){ return !!jget('tt-pin', null); }
function askPin(after, data){
  S.pin = pinSet() ? { step:'verify', after:after, data:data || null, err:'' } : { step:'new', after:after, data:data || null, err:'', first:null };
  render();
}
async function pinSubmit(){
  var inp = $('#pinin'), v = inp ? inp.value.trim() : '', P = S.pin; if (!P) return;
  if (P.step === 'new' || P.step === 'again'){
    if (!/^\d{4,8}$/.test(v)){ P.err = 'Use 4 to 8 digits.'; render(); return; }
    if (P.step === 'new'){ P.first = v; P.step = 'again'; P.err = ''; render(); return; }
    if (v !== P.first){ P.step = 'new'; P.first = null; P.err = 'Those did not match. Start again.'; render(); return; }
    jset('tt-pin', await pinHash(v)); log('parent PIN set');
    return pinDone(P);
  }
  if (P.step === 'verify'){
    if (await pinHash(v) !== jget('tt-pin', null)){ P.err = 'Wrong PIN.'; log('wrong PIN entered'); render(); return; }
    return pinDone(P);
  }
}
function pinDone(P){
  var a = P.after, d = P.data;
  S.pin = null;
  if (a === 'unlock'){ S.pin = { step:'choose', data:d }; render(); return; }
  if (a === 'change'){ S.pin = { step:'new', after:'changed', data:null, err:'', first:null }; render(); return; }
  if (a === 'changed') S.msg = { cls:'good', text:'New PIN saved.' };
  if (a === 'set') S.msg = { cls:'good', text:'Parent PIN saved on this phone.' };
  if (a === 'lockon'){ cfg.lockOn = true; saveCfg(); S.msg = { cls:'good', text:'Lock is on. Sessions open on their day.' }; log('lock on'); }
  if (a === 'lockoff'){ cfg.lockOn = false; saveCfg(); S.msg = { cls:'good', text:'Lock is off on this phone. Everything can be played.' }; log('lock off'); }
  if (a === 'relock'){ unlocks = { s:{}, d:{} }; saveUnlocks(); cfg.lockOn = true; saveCfg(); S.msg = { cls:'good', text:'Everything you unlocked early is locked again.' }; log('relocked'); }
  if (a === 'today'){ cfg.today = d || ''; saveCfg(); S.open = null; S.msg = { cls:'good', text:d ? 'Pretending today is ' + fmtDay(d) + '.' : 'Using the real date again.' }; log('pretend today: ' + (d || 'off')); }
  render();
}
function unlockChoose(kind){
  var P = S.pin; if (!P || P.step !== 'choose') return;
  var s = S.smap[P.data], d = s ? (sesDate(s) || sesFrom(s)) : null;
  if (kind === 'one' && s){ unlocks.s[s.id] = 1; S.msg = { cls:'good', text:'Unlocked: ' + s.title + '.' }; }
  else if (kind === 'day' && d){ unlocks.d[d] = 1; S.msg = { cls:'good', text:'Unlocked everything on ' + fmtDay(d) + '.' }; }
  else if (kind === 'all'){ cfg.lockOn = false; saveCfg(); S.msg = { cls:'good', text:'Lock is off on this phone. Everything can be played.' }; }
  saveUnlocks(); log('unlock ' + kind + ' ' + (s ? s.id : '')); S.pin = null; render();
}
function pinHTML(){
  var P = S.pin, h = '<div class="overlay"><div class="card">';
  if (P.step === 'choose'){
    var s = S.smap[P.data], d = s ? (sesDate(s) || sesFrom(s)) : null;

    h += '<div class="row"><button class="alt" data-act="unl" data-k="all">Turn the lock off</button></div><div class="row"><button class="alt small" data-act="pincancel">Cancel</button></div>';
    return h + '</div></div>';
  }
  var title = P.step === 'verify' ? 'Parent PIN' : P.step === 'new' ? 'Choose a parent PIN' : 'Type the PIN again';

/* ---------- ZIP reader (stored or deflate; no zip64) ---------- */
function u8str(buf, off, len){ return new TextDecoder().decode(new Uint8Array(buf, off, len)); }
function readZip(file){
  var size = file.size, tailLen = Math.min(size, 65557);
  return file.slice(size - tailLen, size).arrayBuffer().then(function(tb){
    var tv = new DataView(tb), i = tb.byteLength - 22;
    for (; i >= 0; i--) if (tv.getUint32(i, true) === 0x06054b50) break;
    if (i < 0) throw new Error('This is not a zip file');
    var total = tv.getUint16(i+10, true), cdSize = tv.getUint32(i+12, true), cdOff = tv.getUint32(i+16, true);
    if (cdOff === 0xffffffff) throw new Error('Zip64 packs are not supported');
    return file.slice(cdOff, cdOff + cdSize).arrayBuffer().then(function(cb){
      var cv = new DataView(cb), p = 0, entries = [];
      for (var n = 0; n < total; n++){
        if (cv.getUint32(p, true) !== 0x02014b50) throw new Error('Damaged zip directory');
        var nlen = cv.getUint16(p+28, true), xlen = cv.getUint16(p+30, true), clen = cv.getUint16(p+32, true);
        entries.push({ name:u8str(cb, p+46, nlen), method:cv.getUint16(p+10, true), csize:cv.getUint32(p+20, true), usize:cv.getUint32(p+24, true), lho:cv.getUint32(p+42, true) });
        p += 46 + nlen + xlen + clen;
      }
      return entries;
    });
  });
}
function zipBlob(file, e){
  return file.slice(e.lho, e.lho + 30).arrayBuffer().then(function(hb){
    var hv = new DataView(hb);
    if (hv.getUint32(0, true) !== 0x04034b50) throw new Error('Damaged zip entry: ' + e.name);
    var start = e.lho + 30 + hv.getUint16(26, true) + hv.getUint16(28, true);
    var raw = file.slice(start, start + e.csize);
    if (e.method === 0) return raw;
    if (e.method === 8 && typeof DecompressionStream !== 'undefined')
      return new Response(raw.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();
    throw new Error('Unsupported zip compression in ' + e.name);
  });
}

/* ---------- progress overlay ---------- */
function progress(n){
  var b = S.busy; if (!b) return;
  b.n = n;
  var frac = b.totalBytes ? b.bytes / b.totalBytes : (b.total ? n / b.total : 0);
  var bar = $('#busybar'); if (bar) bar.style.width = Math.min(100, 100 * frac) + '%';
  var t = $('#busytxt'); if (t) t.textContent = busyText();
}
function busyText(){ var b = S.busy; return b.n + ' / ' + b.total + (b.totalBytes ? ' · ' + fmtMB(b.bytes) + ' of ' + fmtMB(b.totalBytes) : ''); }

/* ---------- import a pack (zip) ---------- */
async function importZip(file){
  S.msg = null; S.busy = { msg:'Reading pack…', n:0, total:0 }; render();
  log('import start: ' + file.name + ' ' + fmtMB(file.size));
  try {
    var entries = await readZip(file);
    var me = entries.filter(function(e){ return /(^|\/)manifest\.json$/.test(e.name); })[0];
    if (!me) throw new Error('No manifest.json in this zip');
    var man = normCat(JSON.parse(await (await zipBlob(file, me)).text()));
    var byName = {}; entries.forEach(function(e){ byName[e.name] = e; });
    S.busy = { msg:'Importing', n:0, total:man.tracks.length, bytes:0, totalBytes:0 }; render();
    var added = 0, skipped = 0, bad = [], n = 0;
    for (var k = 0; k < man.tracks.length; k++){
      var t = man.tracks[k], e = byName[t.file];
      if (!e){ n++; progress(n); continue; }          // a delta pack may carry only some audio
      if (S.have[t.id] && S.have[t.id].sha256 === t.sha256){ skipped++; progress(++n); continue; }
      var buf = await (await zipBlob(file, e)).arrayBuffer();
      if (await sha256(buf) !== t.sha256){ bad.push(t.id + ' ' + (t.title || '') + ': checksum mismatch'); progress(++n); continue; }
      await idbPut({ id:t.id, sha256:t.sha256, size:buf.byteLength, at:Date.now() }, new Blob([buf], { type:'audio/mpeg' }));
      S.have[t.id] = { sha256:t.sha256, size:buf.byteLength };
      added++; progress(++n);
    }
    var newer = !S.cat || (man.catalogueVersion || 0) >= (S.cat.catalogueVersion || 0);
    if (newer) await metaPut('catalogue', clone(man));
    await refreshState();
    var persisted = null;
    try { if (navigator.storage && navigator.storage.persist) persisted = await navigator.storage.persist(); } catch(_){}
    log('import done: added ' + added + ', unchanged ' + skipped + ', problems ' + bad.length + ', catalogue ' + (newer ? 'replaced' : 'kept (pack was older)') + ', persistent: ' + persisted);
    S.msg = bad.length
      ? { cls:'err', text:'Imported ' + added + ', but ' + bad.length + ' problem(s): ' + bad.slice(0,3).join('; ') }
      : { cls:'good', text:'Imported ' + added + ' track(s)' + (skipped ? ', ' + skipped + ' already there' : '') + (newer ? '' : '. This pack\'s catalogue was older, so the phone kept its own') + '.' };
  } catch(err){
    log('import FAILED: ' + err.message);
    S.msg = { cls:'err', text:'Import failed: ' + err.message };
  }
  S.busy = null; render();
}

/* ---------- hosted content: check, download, apply ---------- */
function contentBase(){
  var b = (cfg.base || '').trim();
  try { var h = new URL(b || '../trip-tours-audio/', location.href).href; return h.endsWith('/') ? h : h + '/'; }
  catch(e){ return new URL('../trip-tours-audio/', location.href).href; }
}
function planDownload(man){
  var need = man.tracks.filter(function(t){ var h = S.have[t.id]; return !h || h.sha256 !== t.sha256; });
  var bytes = need.reduce(function(a, t){ return a + (t.size || 0); }, 0);

}
async function checkUpdates(manual){
  if (S.busy) return;

  try {
    var r = await fetch(contentBase() + 'catalogue.json?t=' + Date.now(), { cache:'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var man = normCat(await r.json());
    var plan = planDownload(man);
    var textNew = !S.cat || S.cat.catalogueVersion !== man.catalogueVersion;
    S.upd = { state:'ready', man:man, need:plan.need, bytes:plan.bytes, textNew:textNew, avail: plan.need.length > 0 || textNew, at:Date.now() };
    log('update check: catalogue ' + man.catalogueVersion + ' (phone has ' + (S.cat ? S.cat.catalogueVersion : 'none') + '), ' + plan.need.length + ' track(s) to fetch, ' + fmtMB(plan.bytes));
    if (manual) S.msg = S.upd.avail ? null : { cls:'good', text:'Up to date.' };
  } catch(e){
    S.upd = { state:'error', msg:e.message };

}
async function download(){
  var u = S.upd; if (!u || u.state !== 'ready') return;
  var man = u.man, plan = planDownload(man), need = plan.need;

  await metaPut('catalogue', clone(man));         // text applies even if audio is interrupted
  S.cat = clone(man); buildTree();
  S.busy = { msg: need.length ? 'Downloading' : 'Applying update', n:0, total:need.length, bytes:0, totalBytes:plan.bytes, cancellable:true }; render();
  wake();
  var failed = [], idx = 0, done = 0, base = contentBase();
  async function one(t){
    var url = new URL(t.file, base).href;

      try {
        var r = await fetch(url, { cache:'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        var buf = await r.arrayBuffer();

        await idbPut({ id:t.id, sha256:t.sha256, size:buf.byteLength, at:Date.now() }, new Blob([buf], { type:'audio/mpeg' }));

      } catch(e){

  }
  async function worker(){ while (!S.cancel){ var i = idx++; if (i >= need.length) return; await one(need[i]); done++; progress(done); } }

  if (!cancelled && failed.length === 0){
    var keep = {}; man.tracks.forEach(function(t){ keep[t.id] = 1; });
    var drop = Object.keys(S.have).filter(function(id){ return !keep[id]; });
    if (drop.length){ await idbDel(drop); drop.forEach(function(id){ delete S.have[id]; }); log('tidied ' + drop.length + ' track(s) no longer in the catalogue'); }

  S.busy = null; releaseWake();
  var persisted = null; try { if (navigator.storage && navigator.storage.persist) persisted = await navigator.storage.persist(); } catch(_){}
  log('download ' + (cancelled ? 'paused' : 'finished') + ': ' + done + '/' + need.length + ' track(s), failed ' + failed.length + ', persistent: ' + persisted);
  if (cancelled) S.msg = { text:'Paused. ' + rest.need.length + ' track(s) still to download. Tap Download to continue.' };
  else if (failed.length) S.msg = { cls:'err', text:failed.length + ' track(s) failed: ' + failed.slice(0, 2).join('; ') + '. Tap Download to try again.' };
  else S.msg = { cls:'good', text:need.length ? 'Downloaded ' + need.length + ' track(s). Library ' + S.fp + ' is complete.' : 'Update applied.' };
  render();
}

/* ---------- verify ---------- */
function probeDuration(blob){
  return new Promise(function(res, rej){
    var a = new Audio(), u = URL.createObjectURL(blob), to;
    function done(v, e){ clearTimeout(to); a.onloadedmetadata = a.onerror = null; a.removeAttribute('src'); try { a.load(); } catch(_){} URL.revokeObjectURL(u); e ? rej(e) : res(v); }
    to = setTimeout(function(){ done(0, new Error('decode timeout')); }, 8000);
    a.preload = 'metadata';
    a.onloadedmetadata = function(){ done(a.duration); };
    a.onerror = function(){ done(0, new Error('cannot decode')); };
    a.src = u;
  });
}
async function verifyAll(){
  var list = allTracks().filter(playable);
  S.msg = null; S.busy = { msg:'Verifying', n:0, total:list.length }; render();
  var bad = [], n = 0;
  for (var i = 0; i < list.length; i++){
    var t = list[i];
    try {
      var b = await idbBlob(t.id);
      if (!b) throw new Error('missing from storage');
      if (await sha256(await b.arrayBuffer()) !== S.have[t.id].sha256) throw new Error('checksum mismatch');
      var d = await probeDuration(b);
      if (t.dur && Math.abs(d - t.dur) > 2) throw new Error('plays ' + d.toFixed(1) + 's, expected ' + t.dur + 's');
    } catch(e){ bad.push(t.id + ' ' + (t.title || '') + ': ' + e.message); }
    progress(++n);
  }
  var missing = allTracks().length - list.length;
  var r = { at:Date.now(), ok:list.length - bad.length, total:allTracks().length, bad:bad, fp:S.fp, missing:missing };
  jset('tt-verify', r);
  log('verify: ' + r.ok + '/' + r.total + (missing ? ' (' + missing + ' not downloaded)' : '') + (bad.length ? ' PROBLEMS: ' + bad.join(' | ') : ' all ok'));
  S.busy = null; render();
}

/* ---------- player ---------- */
function sibling(t, d){

  var i = s.tracks.map(function(x){ return x.id; }).indexOf(t.id), x = s.tracks[i + d];
  return x && playable(x) && !trackLocked(x) ? x.id : null;
}
function neighbour(d){ return cur ? sibling(cur.t, d) : null; }
async function load(id, opts){
  opts = opts || {};

  if (trackLocked(t) && !opts.force){ S.msg = { cls:'err', text:'That session is still locked. ' + lockNote(S.smap[t.sessionId]) + '.' }; S.view = 'ses'; S.sesId = t.sessionId; render(); return; }
  var blob = await idbBlob(id);
  if (!blob){ S.msg = { cls:'err', text:'That track has not been downloaded yet.' }; render(); return; }
  if (cur && cur.url) URL.revokeObjectURL(cur.url);
  var url = URL.createObjectURL(blob);
  cur = { t:t, url:url, marked:false }; S.ended = false; S.arm = null; clearInterval(S.armTimer);
  A.src = url; A.defaultPlaybackRate = cfg.speed; A.playbackRate = cfg.speed;
  if (opts.pos) A.addEventListener('loadedmetadata', function(){ A.currentTime = opts.pos; }, { once:true });
  session(t);
  if (opts.autoplay !== false){ try { await A.play(); } catch(e){ log('play() rejected: ' + e.name); } }
  if (cfg.wake) wake();
  render();
}
function toggle(){ if (!cur) return; if (A.paused) A.play().catch(function(e){ log('play() rejected: ' + e.name); }); else A.pause(); }
function skip(d){ if (!cur) return; A.currentTime = Math.max(0, Math.min((A.duration || 1e9) - 0.1, A.currentTime + d)); }
function goNeighbour(d){ var id = neighbour(d); if (id) load(id); else if (d < 0) A.currentTime = 0; }
function saveLast(){ if (cur) jset('tt-last', { id:cur.t.id, pos:A.currentTime }); }
function markPlayed(){ if (cur && !cur.marked){ cur.marked = true; played[cur.t.id] = 1; jset('tt-played', played); } }
var lastSave = 0;
A.addEventListener('play', function(){ S.playing = true; log('play ' + (cur ? cur.t.id : '') + ' @' + A.currentTime.toFixed(1)); syncPlay(); });
A.addEventListener('playing', function(){
  if (S.startTarget){
    var st = S.startTarget, now = Date.now(); S.startTarget = null;
    log('START: play() called ' + (st.fireAt - st.target) + 'ms after target; sound began ' + (now - st.target) + 'ms after target (trim ' + cfg.trim + 'ms)');
  }
});
A.addEventListener('pause', function(){ S.playing = false; log('pause @' + A.currentTime.toFixed(1)); saveLast(); syncPlay(); });
A.addEventListener('ended', function(){

});
A.addEventListener('timeupdate', function(){

A.addEventListener('error', function(){ log('audio error ' + (A.error ? A.error.code + ' ' + (A.error.message || '') : '')); });

A.addEventListener('waiting', function(){ if (A.currentTime > 0.5) log('waiting (buffering) @' + A.currentTime.toFixed(1)); });
document.addEventListener('visibilitychange', function(){
  log('page ' + document.visibilityState + ' | audio ' + (A.paused ? 'paused' : 'playing') + ' @' + A.currentTime.toFixed(1));

window.addEventListener('online', function(){ log('network: online'); if (!S.busy && Date.now() - S.lastCheck > 60000) checkUpdates(false); });
window.addEventListener('offline', function(){ log('network: offline'); });
function session(t){

/* ---------- timed start ("start together") ---------- */
var actx = null;
function beepInit(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){} }
function beep(f, ms){
  if (!actx) return;
  try { var o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; g.gain.value = 0.15; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + ms/1000); } catch(e){}
}
function startAt(step){
  if (!cur){ S.msg = { cls:'err', text:'Choose a track first (tap one in the library).' }; render(); return; }
  beepInit();
  var now = Date.now();
  var target = Math.ceil((now + 6000) / (step * 1000)) * step * 1000;
  A.pause(); try { A.currentTime = 0; } catch(e){}
  S.ended = false; S.arm = { target:target, lastBeep:null };
  if (cfg.wake) wake();
  log('armed: start at ' + clock(target) + ' (trim ' + cfg.trim + 'ms)');
  clearInterval(S.armTimer); S.armTimer = setInterval(armTick, 40);
  render();
}
function cancelArm(){ S.arm = null; clearInterval(S.armTimer); log('start cancelled'); render(); }
function armTick(){
  var a = S.arm; if (!a){ clearInterval(S.armTimer); return; }
  var fireTime = a.target - cfg.trim, remT = a.target - Date.now(), sec = Math.ceil(remT / 1000);
  if (sec <= 3 && sec >= 1 && a.lastBeep !== sec){ a.lastBeep = sec; beep(660, 90); }
  updArm(remT);
  if (fireTime - Date.now() <= 60){
    clearInterval(S.armTimer);
    (function spin(){
      if (Date.now() < fireTime){ setTimeout(spin, 0); return; }
      var fireAt = Date.now(); S.startTarget = { target:a.target, fireAt:fireAt }; S.arm = null;
      A.play().catch(function(e){ log('play() rejected: ' + e.name); });
      render();
    })();
  }
}
function updArm(rem){ var el = $('#cd'); if (el) el.textContent = rem > 0 ? (rem / 1000).toFixed(1) : 'GO'; }

/* ---------- wake lock ---------- */
var wl = null;
function wake(){
  try {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function(l){ wl = l; l.addEventListener('release', function(){ log('screen wake lock released'); }); }).catch(function(e){ log('wake lock failed: ' + e.name); });
  } catch(e){}
}
function releaseWake(){ try { if (wl && !cfg.wake){ wl.release(); wl = null; } } catch(e){} }

/* ---------- where to stand (optional GPS + compass) ---------- */
var R_EARTH = 6371000;
function rad(x){ return x * Math.PI / 180; }
function deg(x){ return x * 180 / Math.PI; }
function distM(a, b){
  var dLa = rad(b.lat - a.lat), dLo = rad(b.lng - a.lng);
  var q = Math.sin(dLa/2) * Math.sin(dLa/2) + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLo/2) * Math.sin(dLo/2);
  return 2 * R_EARTH * Math.asin(Math.min(1, Math.sqrt(q)));
}
function bearingTo(a, b){
  var y = Math.sin(rad(b.lng - a.lng)) * Math.cos(rad(b.lat));
  var x = Math.cos(rad(a.lat)) * Math.sin(rad(b.lat)) - Math.sin(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.cos(rad(b.lng - a.lng));
  return (deg(Math.atan2(y, x)) + 360) % 360;
}
function destPoint(a, brg, m){
  var d = m / R_EARTH, b = rad(brg), la = rad(a.lat), lo = rad(a.lng);
  var la2 = Math.asin(Math.sin(la) * Math.cos(d) + Math.cos(la) * Math.sin(d) * Math.cos(b));
  var lo2 = lo + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(la), Math.cos(d) - Math.sin(la) * Math.sin(la2));
  return { lat:deg(la2), lng:((deg(lo2) + 540) % 360) - 180 };
}
var WIND = ['north', 'north-east', 'east', 'south-east', 'south', 'south-west', 'west', 'north-west'];
function windName(b){ return WIND[Math.round(b / 45) % 8]; }
function fmtDistM(m){ return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(m < 10000 ? 1 : 0) + ' km'; }
function okNum(v, lo, hi){ return typeof v === 'number' && isFinite(v) && v >= lo && v <= hi; }
function cleanSpot(sp){
  if (!sp || !okNum(sp.lat, -90, 90) || !okNum(sp.lng, -180, 180)) return null;
  var o = { lat:sp.lat, lng:sp.lng, radius:okNum(sp.radius, 5, 1000) ? sp.radius : 30, name:String(sp.name || '').slice(0, 80), look:null };
  if (sp.look && okNum(sp.look.lat, -90, 90) && okNum(sp.look.lng, -180, 180) && distM(sp, sp.look) > 1) o.look = { lat:sp.look.lat, lng:sp.look.lng };

}
// The spot a session uses: a test spot (Test tools) wins, then the session's own spot, then its location's spot.
function spotText(sp){ return sp && typeof sp.text === 'string' ? sp.text.replace(/\s+/g, ' ').trim().slice(0, 300) : ''; }
function spotFor(s){
  if (!s) return null;
  var t = cleanSpot(cfg.testSpot); if (t){ t.test = true; t.text = ''; return t; }
  var l = S.lmap[s.locationId];

  h += '<div style="margin-top:8px">' + (remoteOff() ? '<b class="ok">Released for everyone</b> (set in the studio)' : cfg.lockOn ? '<b>Lock is on</b>' : '<b class="bad">Lock is off on this phone</b>') + '</div>';
  h += '<div class="hint">Parent PIN: ' + (pinSet() ? 'set' : '<b class="bad">not set yet</b>') + (nU || nD ? ' · unlocked early: ' + nU + ' session' + (nU === 1 ? '' : 's') + (nD ? ', ' + nD + ' day' + (nD === 1 ? '' : 's') : '') : '') + '</div>';
  h += '<div class="row"><button class="alt small" data-act="' + (pinSet() ? 'pinchange' : 'pinnew') + '">' + (pinSet() ? 'Change PIN' : 'Set PIN') + '</button><button class="alt small" data-act="locktog">' + (cfg.lockOn ? 'Turn lock off' : 'Turn lock on') + '</button></div>';
  h += '<div class="row"><button class="alt small" data-act="relock"' + (nU || nD || !cfg.lockOn ? '' : ' disabled') + '>Lock again what was unlocked</button></div>';
  h += '<div class="big" style="margin-top:14px;font-size:16px">Pretend today is</div><div class="hint">For testing the Today list and the lock. Needs the PIN.' + (validISO(cfg.today) ? ' <b>Now pretending: ' + esc(fmtDay(cfg.today)) + '</b>' : '') + '</div>';
  h += '<div style="margin-top:8px"><input type="date" id="todayinp" value="' + esc(validISO(cfg.today) ? cfg.today : '') + '"></div><div class="row"><button class="alt small" data-act="todayset">Use this date</button><button class="alt small" data-act="todayclear"' + (validISO(cfg.today) ? '' : ' disabled') + '>Use the real date</button></div></section>';
  h += '<section class="card"><div class="big">Library content address</div><div class="hint">Where this phone looks for catalogue.json. The default works when the audio site is called trip-tours-audio.</div><div style="margin-top:8px"><input type="text" id="baseinp" value="' + esc(cfg.base) + '" placeholder="' + esc(contentBase()) + '" autocapitalize="off" autocomplete="off" spellcheck="false"></div>';
  h += '<div class="hint" style="margin-top:6px">Using: ' + esc(contentBase()) + '</div>';
  h += '<div class="hint">Last check: ' + (u ? (u.state === 'ready' ? 'ok, catalogue ' + esc(u.man.catalogueVersion) + ' at ' + when(u.at) : 'failed (' + esc(u.msg) + ')') : 'not yet') + '</div>';
  h += '<div class="row"><button class="alt small" data-act="savebase">Save address</button><button class="alt small" data-act="check">Check now</button></div></section>';
  h += '<section class="card"><div class="hint">Phone clock — photograph all four phones in one shot to compare</div><div class="clock" id="clock">--:--:--.---</div></section>';
  h += '<section class="card"><div class="big">Start-together tuning</div><div class="hint">Each phone starts sound a little late after play(). Trim starts this phone earlier by this many ms so all phones line up.</div>';
  h += '<div class="big" style="margin-top:10px">Trim: <span id="trimv">' + cfg.trim + ' ms</span></div><div class="row" style="margin-top:6px"><button class="alt small" data-act="trim" data-d="-50">−50</button><button class="alt small" data-act="trim" data-d="-10">−10</button><button class="alt small" data-act="trim" data-d="10">+10</button><button class="alt small" data-act="trim" data-d="50">+50</button></div>';
  h += '<div class="row"><button class="alt small" data-act="start30">Start track at next :00 / :30</button></div>';
  if (cur) h += '<div class="hint" style="margin-top:6px">Track: ' + esc(cur.t.title) + '</div>';
  if (S.arm) h += '<div class="banner">Starting at ' + clock(S.arm.target).slice(0, 8) + '<div class="cd" id="cd">…</div></div>';
  h += '</section>';
  h += '<section class="card"><div class="big">Spot test</div><div class="hint">Makes a pretend start spot 40 m north of where you are standing, so you can try the distance, arrow and green zone at home. It replaces every session’s real spot until you clear it.</div>';
  h += '<div class="hint" style="margin-top:6px">' + (cfg.testSpot ? 'Test spot is ON.' : 'Test spot is off.') + '</div><div class="row"><button class="alt small" data-act="testspot">Make test spot</button><button class="alt small" data-act="testclear">Clear test spot</button></div></section>';
  h += '<section class="card"><div class="tog" style="margin-top:0"><span>Keep screen on while playing</span><button class="alt small" data-act="wake">' + (cfg.wake ? 'On' : 'Off') + '</button></div>';
  h += '<div class="hint" style="margin-top:10px">Storage: ' + (st ? fmtMB(st.usage) + ' used of ' + fmtMB(st.quota) + ' · persistent: ' + (st.persisted ? 'yes' : 'no') : 'checking…') + '</div>';
  h += '<div class="hint">Network: ' + (navigator.onLine ? 'online' : 'offline') + ' · installed app: ' + (matchMedia('(display-mode: standalone)').matches ? 'yes' : 'no (browser tab)') + '</div></section>';
  h += '<section class="card"><div class="big">Log</div><pre class="log" id="logbox">' + esc(logbuf.slice(-80).join('\n')) + '</pre><div class="row"><button class="alt small" data-act="copylog">Copy log</button><button class="alt small" data-act="clearlog">Clear log</button></div></section>';
  h += '<section class="card"><div class="big">Library</div><div class="hint">Removes every downloaded track and the catalogue from this phone.</div><div class="row"><button class="alt small" data-act="clear">' + (S.confirmClear ? 'Tap again to delete everything' : 'Delete library') + '</button></div></section>';
  return h;
}
function busyHTML(){
  var b = S.busy, frac = b.totalBytes ? b.bytes / b.totalBytes : (b.total ? b.n / b.total : 0);
  return '<div class="overlay"><div class="card"><div class="big">' + esc(b.msg) + '</div><div class="hint" id="busytxt">' + esc(busyText()) + '</div><div class="bar"><i id="busybar" style="width:' + Math.min(100, 100 * frac) + '%"></i></div><div class="hint" style="margin-top:10px">Keep this screen open.</div>' + (b.cancellable ? '<div class="row"><button class="alt small" data-act="cancel">Pause</button></div>' : '') + '</div></div>';
}
function render(){
  var h = '', v = S.view;
  if (v === 'home') h = homeHTML(); else if (v === 'loc') h = locHTML(); else if (v === 'ses') h = sesHTML(); else if (v === 'now') h = nowHTML(); else if (v === 'tools') h = toolsHTML();
  h += miniHTML();
  if (S.busy) h += busyHTML();
  if (S.pin) h += pinHTML();
  app.innerHTML = h;
  var pi = $('#pinin'); if (pi){ pi.focus(); pi.addEventListener('keydown', function(e){ if (e.key === 'Enter') pinSubmit(); }); }
  updProgress();
  if (v === 'tools'){ storageInfo(); var tok = ++S.clockTok; (function loop(){ if (S.clockTok !== tok || S.view !== 'tools') return; var c = $('#clock'); if (c) c.textContent = clock(Date.now()); requestAnimationFrame(loop); })(); var lb = $('#logbox'); if (lb) lb.scrollTop = lb.scrollHeight; }
  if (S.arm) updArm(S.arm.target - Date.now());
  geoSync(); updSpot();
}
function syncPlay(){
  var b = $('#playbtn'); if (b) b.innerHTML = pp();
  var m = $('#minibtn'); if (m) m.innerHTML = pp();
  if (S.playing && S.ended){ S.ended = false; if (S.view === 'now') render(); }
}
var dragging = false;
function updProgress(){
  var d = A.duration || (cur && cur.t.dur) || 0;
  var tc = $('#tcur'); if (tc) tc.textContent = fmt(A.currentTime);
  var td = $('#tdur'); if (td && A.duration) td.textContent = fmt(A.duration);
  var sk = $('#seek'); if (sk && !dragging && d) sk.value = Math.round(1000 * A.currentTime / d);
}
function storageInfo(){
  if (!(navigator.storage && navigator.storage.estimate)){ S.storage = { usage:0, quota:0, persisted:false }; return; }
  Promise.all([navigator.storage.estimate(), navigator.storage.persisted ? navigator.storage.persisted() : false]).then(function(r){
    var fresh = !S.storage; S.storage = { usage:r[0].usage || 0, quota:r[0].quota || 0, persisted:r[1] };
    if (fresh && S.view === 'tools') render();
  });
}

/* ---------- events ---------- */
app.addEventListener('input', function(e){
  if (e.target.id === 'seek'){ dragging = true; var d = A.duration || (cur && cur.t.dur) || 0; var tc = $('#tcur'); if (tc) tc.textContent = fmt(d * e.target.value / 1000); }
});
app.addEventListener('change', function(e){
  if (e.target.id === 'seek'){ var d = A.duration || (cur && cur.t.dur) || 0; A.currentTime = d * e.target.value / 1000; dragging = false; }
});
app.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'toggle' && el.closest('.mini')) e.stopPropagation();
  var act = el.dataset.act, id = el.dataset.id;
  if (act === 'import'){ pick.value = ''; pick.click(); }
  else if (act === 'verify') verifyAll();
  else if (act === 'check') checkUpdates(true);
  else if (act === 'download') download();
  else if (act === 'cancel'){ S.cancel = true; log('pause requested'); }
  else if (act === 'loc'){ S.view = 'loc'; S.locId = id; S.msg = null; render(); }
  else if (act === 'city'){ var c = el.dataset.city, o = openCities(todayPlan()); o[c] = !o[c]; render(); }
  else if (act === 'unlock'){ askPin('unlock', id); }
  else if (act === 'unl') unlockChoose(el.dataset.k);
  else if (act === 'pinok') pinSubmit();
  else if (act === 'pincancel'){ S.pin = null; render(); }
  else if (act === 'pinnew') askPin('set');
  else if (act === 'pinchange') askPin('change');
  else if (act === 'locktog') askPin(cfg.lockOn ? 'lockoff' : 'lockon');
  else if (act === 'relock') askPin('relock');
  else if (act === 'todayset'){ var ti = $('#todayinp'), tv2 = ti ? ti.value : ''; if (!validISO(tv2)){ S.msg = { cls:'err', text:'Pick a date first.' }; render(); return; } askPin('today', tv2); }
  else if (act === 'todayclear') askPin('today', '');
  else if (act === 'ses'){ S.view = 'ses'; S.sesId = id; S.msg = null; render(); }
  else if (act === 'home'){ S.view = 'home'; S.msg = null; render(); }
  else if (act === 'tools'){ S.view = 'tools'; S.msg = null; S.confirmClear = false; render(); }
  else if (act === 'now'){ S.view = 'now'; render(); }
  else if (act === 'play'){ if (!id) return; S.view = 'now'; S.msg = null; load(id); }
  else if (act === 'resume'){ var l = jget('tt-last', null); if (l){ S.view = 'now'; load(l.id, { pos:l.pos, force:true }); } }
  else if (act === 'toggle') toggle();
  else if (act === 'prev') goNeighbour(-1);
  else if (act === 'next') goNeighbour(1);
  else if (act === 'back10') skip(-10);
  else if (act === 'fwd10') skip(10);
  else if (act === 'speed'){ var sp = [0.9, 1, 1.15, 1.3]; cfg.speed = sp[(sp.indexOf(cfg.speed) + 1) % sp.length]; A.defaultPlaybackRate = cfg.speed; A.playbackRate = cfg.speed; saveCfg(); render(); }
  else if (act === 'auto'){ cfg.auto = !cfg.auto; saveCfg(); render(); }
  else if (act === 'start30') startAt(30);
  else if (act === 'cancelarm') cancelArm();
  else if (act === 'trim'){ cfg.trim = Math.max(-1000, Math.min(1000, cfg.trim + Number(el.dataset.d))); saveCfg(); var tv = $('#trimv'); if (tv) tv.textContent = cfg.trim + ' ms'; }
  else if (act === 'savebase'){ var bi = $('#baseinp'); cfg.base = bi ? bi.value.trim() : ''; saveCfg(); S.upd = null; S.msg = { cls:'good', text:'Address saved.' }; log('content address: ' + contentBase()); render(); }
  else if (act === 'wake'){ cfg.wake = !cfg.wake; saveCfg(); if (cfg.wake) wake(); else if (wl){ wl.release(); wl = null; } render(); }
  else if (act === 'sestogether'){ if (!id) return; S.view = 'now'; S.msg = null; load(id, { autoplay:false }).then(function(){ startAt(30); }); }
  else if (act === 'geoon'){ cfg.geo = true; saveCfg(); G.err = ''; G.fix = null; log('location turned on'); render(); }
  else if (act === 'geooff'){ cfg.geo = false; saveCfg(); G.fix = null; render(); }
  else if (act === 'testclear'){ cfg.testSpot = null; saveCfg(); S.msg = { text:'Test spot cleared.' }; render(); }
  else if (act === 'testspot'){
    if (!navigator.geolocation){ S.msg = { cls:'err', text:'This phone has no location support.' }; render(); return; }
    S.msg = { text:'Getting your location…' }; render();
    navigator.geolocation.getCurrentPosition(function(p){
      var me = { lat:p.coords.latitude, lng:p.coords.longitude }, stand = destPoint(me, 0, 40), look = destPoint(stand, 90, 100);
      cfg.testSpot = { lat:stand.lat, lng:stand.lng, radius:15, name:'Test spot, 40 m north of where you tapped', look:look }; saveCfg();
      log('test spot set near ' + me.lat.toFixed(5) + ',' + me.lng.toFixed(5));
      S.msg = { cls:'good', text:'Test spot made. Open any session and tap Use my location, then walk 40 m north.' }; render();
    }, function(err){ S.msg = { cls:'err', text:err.code === 1 ? 'Location is blocked for this app. Allow it in the phone’s Settings, then try again.' : 'Could not get your location yet. Try outside.' }; render(); }, { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
  }
  else if (act === 'copylog'){
    var txt = logbuf.join('\n');
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function(){ S.msg = { cls:'good', text:'Log copied. Paste it into a chat.' }; render(); }, function(){ var r = document.createRange(); r.selectNodeContents($('#logbox')); var s = getSelection(); s.removeAllRanges(); s.addRange(r); S.msg = { text:'Log selected. Long-press to copy.' }; });
  }
  else if (act === 'clearlog'){ logbuf = []; jset('tt-log', []); var lb = $('#logbox'); if (lb) lb.textContent = ''; }
  else if (act === 'clear'){
    if (!S.confirmClear){ S.confirmClear = true; render(); return; }
    S.confirmClear = false; A.pause(); cur = null; A.removeAttribute('src');
    idbClearAll().then(refreshState).then(function(){ ['tt-verify','tt-last','tt-played'].forEach(function(k){ localStorage.removeItem(k); }); played = {}; S.upd = null; log('library deleted'); S.msg = { text:'Library deleted.' }; S.view = 'home'; render(); });
  }
});
pick.addEventListener('change', function(){ var f = pick.files && pick.files[0]; if (f) importZip(f); });

/* ---------- start ---------- */
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(){ log('app cached for offline use'); }, function(e){ log('service worker failed: ' + e.message); });
}
log('app opened v' + VER + (matchMedia('(display-mode: standalone)').matches ? ' (installed)' : ' (browser tab)') + ' · ' + navigator.userAgent.replace(/^Mozilla\/5.0 /, '').slice(0, 90));
render();
refreshState().then(function(){ render(); if (navigator.onLine) return checkUpdates(false); })
  .catch(function(e){ S.msg = { cls:'err', text:'Storage problem: ' + e.message }; render(); });
document.addEventListener('visibilitychange', function(){ geoSync(); });
window.__tt = { S:S, A:A, cfg:cfg, load:load, isLocked:isLocked, todayPlan:todayPlan, todayISO:todayISO, fmtDay:fmtDay, unlocks:function(){ return unlocks; }, checkUpdates:checkUpdates, G:G, spotFor:spotFor, geoSync:geoSync, tiltHeading:tiltHeading, bearingTo:bearingTo, distM:distM };
})();
</script>
</body>
</html>
